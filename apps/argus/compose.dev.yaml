name: argus-dev
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${ARGUS_DEV_POSTGRES_PASSWORD:?Set ARGUS_DEV_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${ARGUS_DEV_POSTGRES_PORT:-55433}:5432"
    volumes:
      - argus-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  argus-dev-postgres:

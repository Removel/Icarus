name: mem0-dev

services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "${ICARUS_MEM0_BIND_HOST:-127.0.0.1}:${ICARUS_MEM0_PORT:-8888}:8000"
    networks:
      - mem0_network
    volumes:
      # Modified for Icarus: durable state lives outside the source checkout.
      - ${ICARUS_DATA_DIR:?Set ICARUS_DATA_DIR}/services/mem0/history:/app/history
      - ${ICARUS_DATA_DIR:?Set ICARUS_DATA_DIR}/services/mem0/models:/root/.cache/fastembed
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      # Modified for Icarus: map the parent application's fixed Secret names.
      - ADMIN_API_KEY=${ICARUS_MEM0_API_KEY:-}
      - OPENAI_API_KEY=${ICARUS_MEM0_LLM_API_KEY:?Set ICARUS_MEM0_LLM_API_KEY}
      - POSTGRES_HOST=${ICARUS_MEM0_POSTGRES_HOST:?Set ICARUS_MEM0_POSTGRES_HOST}
      - POSTGRES_PORT=${ICARUS_MEM0_DB_PORT:-5432}
      - POSTGRES_USER=${ICARUS_MEM0_POSTGRES_USER:-postgres}
      - POSTGRES_DB=${ICARUS_MEM0_POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${ICARUS_MEM0_POSTGRES_PASSWORD:?Set ICARUS_MEM0_POSTGRES_PASSWORD}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - APP_DB_NAME=${ICARUS_MEM0_APP_DB_NAME:-mem0_app}
      - JWT_SECRET=${ICARUS_MEM0_JWT_SECRET:?Set ICARUS_MEM0_JWT_SECRET}
      - AUTH_DISABLED=${ICARUS_MEM0_AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${ICARUS_MEM0_TELEMETRY:-false}
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
      - OPENAI_BASE_URL=${ICARUS_MEM0_OPENAI_BASE_URL:-}
      - MEM0_DEFAULT_LLM_MODEL=${ICARUS_MEM0_LLM_MODEL:-deepseek-v4-flash}
      - MEM0_DEFAULT_EMBEDDER_PROVIDER=${ICARUS_MEM0_EMBEDDER_PROVIDER:-fastembed}
      - MEM0_DEFAULT_EMBEDDER_MODEL=${ICARUS_MEM0_EMBEDDER_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - MEM0_DEFAULT_EMBEDDING_DIMS=${ICARUS_MEM0_EMBEDDING_DIMS:-384}

networks:
  mem0_network:
    driver: bridge

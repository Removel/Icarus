name: WebUI
on:
  workflow_dispatch:
  push:
    paths: ['apps/webui/**', '.github/workflows/webui.yml']
  pull_request:
    paths: ['apps/webui/**', '.github/workflows/webui.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # A cold browser/dependency install can take 10+ minutes; tests take about 12.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/webui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/webui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/webui/test/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Install headless Chromium and system dependencies
        timeout-minutes: 15
        run: uv run --no-project --with-requirements test/requirements.txt python -m playwright install --with-deps --only-shell chromium
      - name: Run WebUI tests
        timeout-minutes: 20
        run: |
          mkdir -p test-results
          pnpm dev > test-results/dev-server.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 60 --max-time 2 --fail --silent --show-error --output /dev/null http://127.0.0.1:5173/
          pnpm test --junitxml=test-results/junit.xml --durations=15
      - run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm build
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-test-results
          path: apps/webui/test-results/
          if-no-files-found: ignore

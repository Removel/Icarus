name: WebUI
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths: ['apps/webui/**', '.github/workflows/webui.yml']
  pull_request:
    paths: ['apps/webui/**', '.github/workflows/webui.yml']
permissions:
  contents: read
concurrency:
  group: webui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Playwright 1.58 supports Ubuntu 24.04; avoid an implicit OS migration.
    runs-on: ubuntu-24.04
    # A cold browser/dependency install can take 10+ minutes; tests take about 12.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/webui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/webui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/webui/test/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Fast static checks and production build
        run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm build
      - name: Install headless Chromium and system dependencies
        timeout-minutes: 15
        run: uv run --no-project --with-requirements test/requirements.txt python -m playwright install --with-deps --only-shell chromium
      - name: Run WebUI tests
        timeout-minutes: 20
        run: |
          python scripts/test.py --junitxml=test-results/junit.xml --durations=15
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webui-test-results
          path: apps/webui/test-results/
          retention-days: 14
          if-no-files-found: ignore

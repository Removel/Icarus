name: WebUI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Playwright 1.58 supports Ubuntu 24.04; avoid an implicit OS migration.
    runs-on: ubuntu-24.04
    # Independent runners keep browser state, ports and production assets isolated.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/webui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/webui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/webui/test/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Fast static checks and production build
        if: matrix.shard == 1
        env:
          RELA_MEM_API_TOKEN: isolated-build-rela-token
        run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm build
      - name: Install headless Chromium and system dependencies
        timeout-minutes: 15
        run: uv run --no-project --with-requirements test/requirements.txt python -m playwright install --with-deps --only-shell chromium
      - name: Run WebUI tests
        timeout-minutes: 20
        run: |
          python scripts/test.py --shard-index=${{ matrix.shard }} --shard-total=4 \
            --use-existing-build --junitxml=test-results/junit.xml \
            --timings-json=test-results/timings.json --durations=20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webui-test-results-${{ matrix.shard }}
          path: apps/webui/test-results/
          retention-days: 14
          if-no-files-found: ignore
  reports:
    name: Verify complete WebUI coverage
    if: always()
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: webui-test-results-*
          path: apps/webui/test-results/shards
      - name: Require every collected test exactly once and publish phase timings
        run: python apps/webui/scripts/check_test_reports.py apps/webui/test-results/shards --expected-shards=4
      - name: Require all shard jobs to succeed
        if: needs.check.result != 'success'
        run: exit 1

name: Build application images
on:
  workflow_call:
    inputs:
      apps:
        type: string
        default: '["webui","mem0","openkb","rela-mem"]'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps || '["webui","mem0","openkb","rela-mem"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build repository source without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/${{ matrix.app == 'mem0' && 'server/Dockerfile' || matrix.app == 'openkb' && 'Dockerfile.icarus' || 'Dockerfile' }}
          platforms: linux/amd64
          push: false
          load: true
          tags: icarus-${{ matrix.app }}:check
          cache-from: type=gha,scope=images-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.app }}
      - name: Start the exact built image with isolated app-owned fixtures
        run: python3 scripts/ci/smoke_image.py "$APP" "icarus-${APP}:check"
        env:
          APP: ${{ matrix.app }}

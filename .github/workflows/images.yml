name: Build application images
on:
  workflow_dispatch:
  push:
    paths: ['apps/mem0/**', 'apps/openkb/**', '.gitattributes', '.gitignore', '.github/workflows/images.yml']
  pull_request:
    paths: ['apps/mem0/**', 'apps/openkb/**', '.gitattributes', '.gitignore', '.github/workflows/images.yml']
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mem0
            context: apps/mem0
            dockerfile: apps/mem0/server/dev.Dockerfile
          - app: openkb
            context: apps/openkb
            dockerfile: apps/openkb/Dockerfile.icarus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build repository source without publishing
        run: docker build --pull --no-cache -t icarus-${{ matrix.app }}:check -f ${{ matrix.dockerfile }} ${{ matrix.context }}

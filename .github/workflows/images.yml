name: Build application images
on:
  workflow_dispatch:
  push:
    paths: ['apps/webui/**', 'apps/mem0/**', 'apps/openkb/**', 'apps/rela-mem/**', '.gitattributes', '.gitignore', '.github/workflows/images.yml']
  pull_request:
    paths: ['apps/webui/**', 'apps/mem0/**', 'apps/openkb/**', 'apps/rela-mem/**', '.gitattributes', '.gitignore', '.github/workflows/images.yml']
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: webui
            context: apps/webui
            dockerfile: apps/webui/Dockerfile
          - app: mem0
            context: apps/mem0
            dockerfile: apps/mem0/server/Dockerfile
          - app: openkb
            context: apps/openkb
            dockerfile: apps/openkb/Dockerfile.icarus
          - app: rela-mem
            context: apps/rela-mem
            dockerfile: apps/rela-mem/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build repository source without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: icarus-${{ matrix.app }}:check
          cache-from: type=gha,scope=images-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.app }}

name: Service application contracts
on:
  workflow_call:
    inputs:
      apps:
        type: string
        default: '["mem0","openkb","rela-mem"]'
      skip_control:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps || '["mem0","openkb","rela-mem"]') }}
    env:
      MEM0_TELEMETRY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: bash apps/${{ matrix.app }}/scripts/install.sh --dev
      - name: Run application-owned contracts
        shell: bash
        env:
          PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/test-results/${{ matrix.app }}.xml
        run: |
          mkdir -p test-results
          set -o pipefail
          make test-${{ matrix.app }} 2>&1 | tee test-results/${{ matrix.app }}.log
      - name: Verify OpenKB lock without rewriting it
        if: matrix.app == 'openkb'
        run: uv lock --check --project apps/openkb
      - name: Run rela-mem against isolated databases
        if: matrix.app == 'rela-mem'
        run: python apps/rela-mem/scripts/ci-integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: service-contracts-${{ matrix.app }}
          path: |
            test-results/
            apps/rela-mem/test-results/
          retention-days: 14
          if-no-files-found: ignore
  repository-control:
    if: ${{ !inputs.skip_control }}
    uses: ./.github/workflows/control.yml

name: Extended service regressions
on:
  schedule:
    - cron: '17 20 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-services
  cancel-in-progress: false
jobs:
  retained-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [mem0, openkb]
    env:
      MEM0_TELEMETRY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Record exact tested baseline
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - run: bash apps/${{ matrix.app }}/scripts/install.sh --dev
      - name: Preserve retained suite failures and collection errors
        env:
          APP: ${{ matrix.app }}
          PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/test-results/${{ matrix.app }}-full.xml
        run: |
          mkdir -p test-results
          set -o pipefail
          make "test-${APP}-full" 2>&1 | tee "test-results/${APP}-full.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extended-${{ matrix.app }}-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

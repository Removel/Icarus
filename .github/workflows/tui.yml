name: TUI
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths: ['apps/tui/**', 'apps/gateway/**', 'packages/**', 'scripts/**', '.github/workflows/tui.yml']
  pull_request:
    paths: ['apps/tui/**', 'apps/gateway/**', 'packages/**', 'scripts/**', '.github/workflows/tui.yml']
permissions:
  contents: read
concurrency:
  group: tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -c "from pathlib import Path; Path('.env').touch()"
      - run: bash apps/tui/scripts/install.sh --dev
      - run: make test-tui
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/tui.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tui-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
